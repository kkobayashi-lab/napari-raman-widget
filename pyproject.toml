[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-raman-widget"
version = "0.1.0"
description = "napari widget for controlling the CNS Raman microscopy rig"
requires-python = ">=3.10"
dependencies = [
    "napari",
    "numpy>=2.0,<2.1",
    "qtpy",
    "matplotlib",
    "h5py",
    "tifffile>=2024.8.30,<2025",
    "xarray",
    "zarr",
]

[tool.setuptools.packages.find]
include = ["napari_raman_widget*"]
