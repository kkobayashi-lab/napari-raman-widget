[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-raman-widget"
version = "1.0.0"
description = "napari widget for controlling the CNS Raman microscopy rig"
requires-python = ">=3.10"
dependencies = [
    "napari",
    "numpy>=2.0,<2.1",
    "qtpy",
    "matplotlib",
    "h5py",
    "tifffile>=2024.8.30,<2025",
    "xarray",
    "zarr",
    "napari-micromanager==0.1.3",
    "pymmcore-widgets==0.9.1",
    "pymmcore-plus==0.13.4",
    "useq-schema==0.9.2",
]

[tool.setuptools.packages.find]
include = ["napari_raman_widget*"]
